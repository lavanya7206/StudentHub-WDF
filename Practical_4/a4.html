<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - StudentHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-top">
        <img src="Logo_StudentHub.png" alt="Logo" class="logo">
        <h1>StudentHub</h1>
    </div>
    <nav>
        <a href="a.html">HOME</a>
        <a href="a1.html">ABOUT</a>
        <a href="a3.html">CONTACT</a>
        <a href="a4.html">REGISTER</a>
        <a href="a5.html">LOGIN</a>
        <a href="a6.html">DASHBOARD</a>
        <a href="a7.html">EVENTS</a>
        <a href="a8.html">PROFILE</a>
        <a href="a9.html">FAQ</a>
        <a href="a10.html">FEEDBACK</a>
    </nav>
</header>
<section class="register">
    <h2>Student Registration</h2>
    <p>Create your StudentHub account.</p>
    <p id="successMsg" style="color: #28a745; font-weight: bold;"></p>
    <form id="regForm" novalidate>
        <div class="form-group">
            <input type="text" id="name" placeholder="Full Name">
            <small id="nameError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <input type="email" id="email" placeholder="Email Address">
            <small id="emailError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <input type="tel" id="mobile" placeholder="10-Digit Mobile Number">
            <small id="mobileError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password">
            <small id="passError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <input type="password" id="confirmPass" placeholder="Confirm Password">
            <small id="confirmPassError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="Diploma">Diploma</option>
            </select>
            <small id="courseError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <label>Year of Study:</label><br>
            <label><input type="radio" name="year" value="1"> 1st</label>
            <label><input type="radio" name="year" value="2"> 2nd</label>
            <label><input type="radio" name="year" value="3"> 3rd</label>
            <label><input type="radio" name="year" value="4"> 4th</label>
            <small id="yearError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <label>Gender:</label><br>
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
            <small id="genderError" style="color: #dc3545; display: block;"></small>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="terms"> I accept the terms and conditions
            </label>
            <small id="termsError" style="color: #dc3545; display: block;"></small>
        </div>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account?
        <a href="a5.html">Login Here</a>
    </p>
</section>
<footer>
    <p>© 2026 StudentHub | All Rights Reserved</p>
</footer>
<script src="script.js"></script>
</body>
</html>
